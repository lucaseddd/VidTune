<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>VidTune</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand"><span class="brand-mark" aria-hidden="true">▶</span><div><strong>VidTune</strong><small>Video, your way</small></div><button id="open-settings" class="settings-link" type="button" aria-label="Open settings" title="Settings">⚙</button><span class="version">v0.5.2</span></header>
    <section class="card speed-card" aria-labelledby="speed-heading">
      <div class="card-heading"><h1 id="speed-heading">Speed</h1><span id="speed-note" class="status">Ready</span></div>
      <div class="speed-control">
        <button id="decrease" type="button" class="step-button" aria-label="Decrease speed">−</button>
        <output id="speed-value" aria-live="polite">1×</output>
        <button id="increase" type="button" class="step-button" aria-label="Increase speed">+</button>
      </div>
      <div id="presets" class="presets" aria-label="Speed presets">
        <button type="button" data-speed="0.5">0.5×</button>
        <button type="button" data-speed="1">1×</button>
        <button type="button" data-speed="1.5">1.5×</button>
        <button type="button" data-speed="2">2×</button>
        <button type="button" data-speed="3">3×</button>
        <button type="button" data-speed="4">4×</button>
      </div>
      <form id="manual-speed" class="manual-row" novalidate>
        <label for="manual-value">Custom</label>
        <input id="manual-value" type="number" min="0.1" max="16" step="0.1" inputmode="decimal" aria-describedby="speed-range" required>
        <button type="submit" class="secondary">Apply</button>
      </form>
      <div class="speed-footer"><span id="speed-range">0.1×–16×</span><button id="reset" type="button" class="text-button">Reset to 1×</button></div>
    </section>
    <section class="card volume-card" aria-labelledby="volume-heading">
      <div class="card-heading"><h2 id="volume-heading">Volume</h2><output id="volume-value" for="volume-slider">100%</output></div>
      <input id="volume-slider" type="range" min="0" max="200" step="1" value="100" aria-label="Video volume" aria-valuetext="100%">
      <div class="volume-scale" aria-hidden="true"><span>0%</span><span>100%</span><span>300%</span></div>
    </section>
    <section class="card" aria-labelledby="video-heading">
      <div class="card-heading"><h2 id="video-heading">Current page</h2><span id="status" class="status">Checking…</span></div>
      <p id="site" class="site">—</p>
      <p id="video-summary" class="summary" role="status" aria-live="polite">Looking for videos…</p>
      <button id="refresh" type="button" class="secondary">Scan again</button>
    </section>
    <p class="footnote">Video shortcuts: A slower · D faster · Q reset</p>
  </main>
  <script type="module" src="src/popup.js"></script>
</body>
</html>

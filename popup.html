<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>VidTune</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">▶</span>
      <div><strong>VidTune</strong><small id="status" role="status" aria-live="polite">Checking…</small></div>
      <button id="open-settings" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
      <span class="version">Modular</span>
    </header>
    <fieldset class="model-picker">
      <legend>Modules</legend>
      <label><input type="radio" name="module-count" value="2"> 2</label>
      <label><input type="radio" name="module-count" value="5"> 5</label>
      <label><input type="radio" name="module-count" value="10"> 10</label>
    </fieldset>
    <div id="module-list" class="module-list" aria-label="Choose functions for each module"></div>
    <label class="smart-toggle"><input id="smart-organize" type="checkbox"><span><strong>Smart Organize</strong><small>Arrange selected tools automatically</small></span></label>
    <p class="footnote">A slower · D faster · Q reset</p>
    <span id="site" class="visually-hidden">—</span>
    <span id="video-summary" class="visually-hidden" role="status">Looking for videos…</span>
  </main>
  <template id="module-speed"><button id="decrease" type="button" data-action="DECREASE" aria-label="Decrease speed">−</button><output id="speed-value">1×</output><button id="increase" type="button" data-action="INCREASE" aria-label="Increase speed">+</button></template>
  <template id="module-volume"><input id="volume-slider" type="range" min="0" max="200" step="1" value="100" aria-label="Video volume"><output id="volume-value">100%</output></template>
  <template id="module-mono"><label class="toggle"><input id="mono-toggle" type="checkbox"> Mix L + R</label></template>
  <template id="module-pip"><button id="toggle-pip" type="button" data-action="TOGGLE_PIP" aria-label="Open Picture in Picture" title="Picture in Picture">▣</button></template>
  <template id="module-presets"><select id="preset-choice" aria-label="Choose speed preset"></select></template>
  <template id="module-customSpeed"><input id="manual-value" type="number" min="0.1" max="16" step="0.1" inputmode="decimal" aria-label="Custom speed"><button type="button" data-action="CUSTOM_SPEED">Apply</button></template>
  <template id="module-resetSpeed"><button id="reset" type="button" data-action="RESET" class="wide-control">Reset to 1×</button></template>
  <template id="module-seekBackward"><button type="button" data-action="SEEK_BACKWARD" class="wide-control">↶ Skip back</button></template>
  <template id="module-seekForward"><button type="button" data-action="SEEK_FORWARD" class="wide-control">Skip forward ↷</button></template>
  <template id="module-tabVolume"><label class="toggle"><input id="tab-volume-only" type="checkbox"> Separate volume</label></template>
  <script type="module" src="src/popup.js"></script>
</body>
</html>

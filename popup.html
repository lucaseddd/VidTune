<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>VidTune</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">▶</span>
      <div><strong>VidTune</strong><small id="status" role="status" aria-live="polite">Checking…</small></div>
      <span class="version">v0.8.2</span>
    </header>
    <div class="layout-bar">
      <label class="layout-picker" for="tool-count"><span>Layout</span><select id="tool-count" aria-label="Number of tools"><option value="2">2 tools</option><option value="5">5 tools</option><option value="10">10 tools</option></select></label>
      <label class="smart-toggle" for="smart-organize"><input id="smart-organize" type="checkbox"><span>Smart Organize</span></label>
    </div>
    <button id="customize-tools" type="button" aria-expanded="false" aria-controls="tool-choices">Choose tools <span aria-hidden="true">⌄</span></button>
    <div id="tool-choices" hidden></div>
    <div id="module-list" class="module-list" aria-label="Selected tools"></div>
    <footer class="popup-footer"><span class="footnote">A slower · D faster · Q reset</span><button id="open-settings" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button></footer>
    <span id="site" class="visually-hidden">—</span>
    <span id="video-summary" class="visually-hidden" role="status">Looking for videos…</span>
  </main>
  <template id="module-speed"><button id="decrease" type="button" data-action="DECREASE" aria-label="Decrease speed">−</button><output id="speed-value">1×</output><button id="increase" type="button" data-action="INCREASE" aria-label="Increase speed">+</button></template>
  <template id="module-volume"><input id="volume-slider" type="range" min="0" max="200" step="1" value="100" aria-label="Video volume"><output id="volume-value">100%</output></template>
  <template id="module-mono"><label class="toggle"><input id="mono-toggle" type="checkbox"> Mono</label></template>
  <template id="module-pip"><button id="toggle-pip" type="button" data-action="TOGGLE_PIP" aria-label="Open Picture in Picture" title="Picture in Picture"><span class="state-box" aria-hidden="true"></span> PiP</button></template>
  <template id="module-presets"><select id="preset-choice" aria-label="Choose speed preset"></select></template>
  <template id="module-customSpeed"><input id="manual-value" type="number" min="0.1" max="16" step="0.1" inputmode="decimal" aria-label="Custom speed"><button type="button" data-action="CUSTOM_SPEED">Apply</button></template>
  <template id="module-resetSpeed"><button id="reset" type="button" data-action="RESET" class="wide-control">Reset to 1×</button></template>
  <template id="module-seekBackward"><button type="button" data-action="SEEK_BACKWARD" class="wide-control">↶ Skip back</button></template>
  <template id="module-seekForward"><button type="button" data-action="SEEK_FORWARD" class="wide-control">Skip forward ↷</button></template>
  <template id="module-tabVolume"><label class="toggle"><input id="tab-volume-only" type="checkbox"> This tab only</label></template>
  <template id="smart-speed-extra"><div class="speed-presets" aria-label="Quick playback speeds"></div><div class="speed-details"><label>Custom <input id="smart-manual" type="number" min="0.1" max="16" step="0.1" aria-label="Custom playback speed"></label><button type="button" data-action="SMART_SPEED">Apply</button><button type="button" data-action="RESET" class="reset-link">Reset 1×</button></div></template>
  <template id="smart-volume-extra"><div class="volume-marks" aria-hidden="true"><span>0%</span><span>100%</span><span>300%</span></div><div class="volume-presets" aria-label="Quick volume levels"><button type="button" data-volume="0">Mute</button><button type="button" data-volume="1">100%</button><button type="button" data-volume="2">200%</button><button type="button" data-volume="3">300%</button></div></template>
  <script type="module" src="src/popup.js"></script>
</body>
</html>
